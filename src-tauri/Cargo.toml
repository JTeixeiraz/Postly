[package]
name = "postly"
version = "0.1.0"
description = "Gerenciador comercial de publicacoes sociais operado por agentes de IA locais"
edition = "2021"
rust-version = "1.77"

[lib]
name = "postly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# Sem doctest. Nao ha nenhum para rodar, e num crate que tambem e cdylib o
# rustdoc nao acha a rlib do `tauri` na hora de linkar: `cargo test` terminava
# com codigo 1 depois de todos os testes passarem, que e a pior forma de falhar
# para quem clona o repositorio e roda a suite pela primeira vez.
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = "0.33"
bincode = "1.3"
zstd = "0.13"
chrono = "0.4"
anyhow = "1"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
dirs = "5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
