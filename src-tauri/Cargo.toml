[package]
name = "postly"
version = "0.1.1"
description = "Gerenciador comercial de publicacoes sociais operado por agentes de IA locais"
edition = "2021"
rust-version = "1.77"

[lib]
name = "postly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# Sem doctest. Nao ha nenhum para rodar, e num crate que tambem e cdylib o
# rustdoc nao acha a rlib do `tauri` na hora de linkar: `cargo test` terminava
# com codigo 1 depois de todos os testes passarem, que e a pior forma de falhar
# para quem clona o repositorio e roda a suite pela primeira vez.
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# `stream` é o que permite mostrar progresso de download: sem ela o corpo só
# chega inteiro, e a barra saltaria de 0 a 100.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
# Já está na árvore por dependência do glib; declarar aqui é só tornar
# explícito o uso do `StreamExt` no download da atualização.
futures-util = { version = "0.3", default-features = false }
sysinfo = "0.39"
bincode = "1.3"
zstd = "0.13"
chrono = "0.4"
anyhow = "1"
base64 = "0.23"
aes-gcm = "0.11"
rand = "0.8"
dirs = "6"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# A feature `test` do Tauri da um AppHandle de verdade sem abrir janela. Sem
# ela, o caminho do aviso de cota so poderia ser exercitado a olho.
tauri = { version = "2", features = ["test"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
