# Verifica toda contribuição antes que ela chegue no `main`.
#
# Roda em `pull_request` e NÃO em `pull_request_target`: a diferença decide a
# segurança do repositório. `pull_request_target` executaria o código do PR com
# o token e os segredos do repositório de destino — um PR de um desconhecido
# poderia ler tudo. Aqui o job roda no contexto do fork, sem segredo nenhum, e
# o token é somente leitura.
name: verificar

on:
  pull_request:
  push:
    branches: [main]

# Menos que o padrão, de propósito: este workflow só precisa ler o código.
permissions:
  contents: read

concurrency:
  # Um push novo cancela a verificação anterior do mesmo PR.
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ./src-tauri -> target }
      - name: Formatação
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --tests -- -D warnings
      - name: Testes
        # Alvos explícitos: os dois testes que falam com um Ollama vivo estão
        # num binário próprio e não rodam no runner, que não tem Ollama.
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --test cerebro --test sistema

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Tipos e build do aplicativo
        run: npm run build
      - name: Site
        # `npm run build` do site roda os importadores antes, e o de CSS falha
        # quando uma classe do site passa a colidir com uma do aplicativo.
        run: |
          npm ci --prefix site
          npm run build --prefix site
