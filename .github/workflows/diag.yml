# Diagnóstico descartável: valida variantes do manifesto para descobrir o que
# o `winget validate` do runner aceita. Apagado assim que a resposta aparecer.
name: winget-diag
on: { workflow_dispatch: }
permissions: { contents: read }
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - shell: pwsh
        run: |
          Write-Host "=== versão do winget no runner ==="
          winget --version
          Write-Host ""

          $url = "https://github.com/JTeixeiraz/Postly/releases/download/v0.1.0/Postly_0.1.0_x64-setup.exe"
          $sha = "390727BCCFC5F03D7A60A0605A124C8E685FB51526300BC23BEB2CC905BEE3FA"

          # Cada variante muda UMA coisa, para a resposta ser atribuível.
          $variantes = @(
            @{ nome = "A-1.12-LF";        ver = "1.12.0"; crlf = $false },
            @{ nome = "B-1.12-CRLF";      ver = "1.12.0"; crlf = $true  },
            @{ nome = "C-1.9-LF";         ver = "1.9.0";  crlf = $false },
            @{ nome = "D-1.6-LF";         ver = "1.6.0";  crlf = $false }
          )

          foreach ($v in $variantes) {
            $d = "diag/$($v.nome)/manifests/j/JTeixeiraz/Postly/0.1.0"
            New-Item -ItemType Directory -Force -Path $d | Out-Null
            Get-ChildItem winget/*.yaml | ForEach-Object {
              $t = (Get-Content $_.FullName -Raw).
                    Replace('__VERSAO__','0.1.0').Replace('__URL__',$url).
                    Replace('__SHA256__',$sha).Replace('__DATA__','2026-08-30').
                    Replace('1.12.0', $v.ver)
              if ($v.crlf) { $t = $t.Replace("`n", "`r`n").Replace("`r`r`n","`r`n") }
              [IO.File]::WriteAllText("$d/$($_.Name)", $t, (New-Object Text.UTF8Encoding $false))
            }
            Write-Host "── $($v.nome) ──"
            winget validate --manifest $d 2>&1 | Select-Object -First 6 | ForEach-Object { Write-Host "   $_" }
            Write-Host "   exit=$LASTEXITCODE"
            Write-Host ""
          }
